axum-valid = "0.24.0"
base64 = "0.22.1"
bytes = "1.11.1"
calamine = "0.35.0"
chrono = "0.4.43"
clap = "4"
criterion = "0.8.2"
croner = "3.0.1"
flume = "0.12.0"
futures = "0.3.32"
garde = "0.23.0"
governor = "0.10.4"
hex = "0.4.3"
http = "1.4.1"
indexmap = "2.14.0"
